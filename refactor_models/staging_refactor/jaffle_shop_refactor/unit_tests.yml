unit_tests:
  - name: test_order_order_status_cleanup 
    description: Test order_status in case when logic 
    model: stg_jaffle_shop_refactor__orders 
    given: 
      - input: source('jaffle_shop',  'orders')
        rows:
         - {id: 1, status: returned}
         - {id: 2, status: return_pending}
         - {id: 3, status: completed}
         - {id: 4, status: pending}
         - {id: 5, status: shipped}
         - {id: 6, status: placed}
         - {id: 7, status: shipped_pending}
         
    expect: # the expected output given the inputs above
      rows:
        - {order_id: 1, order_status: returned}
        - {order_id: 2, order_status: returned}
        - {order_id: 3, order_status: completed}
        - {order_id: 4, order_status: placed}
        - {order_id: 5, order_status: shipped}
        - {order_id: 6, order_status: placed}
        - {order_id: 7, order_status: shipped}

  - name: test_date_diff
    description: Test date difference for days_since_ordered
    model: stg_jaffle_shop_refactor__orders
    overrides: 
      macros:
        dbt.current_timestamp: "date('2026-10-25')"
    given:
      - input: source('jaffle_shop','orders')
        rows: 
          - {order_date: 2026-10-20}
    expect:
      rows:
        - {order_date: 2026-10-20, days_since_ordered: 5}
    
  - name: test_full_name
    description: Test full name of customers 
    model: stg_jaffle_shop_refactor__customers
    given:
      - input: source('jaffle_shop','customers')
        rows: 
          - {first_name: Grace,     last_name: Goheen}
          - {first_name: Michelle,  last_name: Ark}
          - {first_name: Gerda,     last_name: Shank}
          - {first_name: Doug,     last_name: Beaty}
    expect:
      rows:
          - {full_name: Grace Goheen}
          - {full_name: Michelle Ark}
          - {full_name: Gerda Shank}
          - {full_name: Doug Beaty}
