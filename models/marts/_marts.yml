version: 2

models:
  - name: fct_orders
    description: >
      One row per order, enriched with the total amount of successful payments.
      This incremental fact table is the canonical order-level mart for revenue analysis.
    columns:
      - name: order_id
        description: Primary key for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier for the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: Date the order was placed.
      - name: amount
        description: Total amount of successful payments recorded for the order, or zero when none exist.

  - name: dim_customers
    description: >
      One row per customer, enriched with first and most recent order dates plus
      lifetime order and revenue rollups.
    columns:
      - name: customer_id
        description: Primary key for the customer.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Date of the customer's earliest order; null when the customer has not ordered.
      - name: most_recent_order_date
        description: Date of the customer's latest order; null when the customer has not ordered.
      - name: number_of_orders
        description: Count of orders placed by the customer, including zero for customers without orders.
      - name: lifetime_value
        description: Sum of successful-payment amounts across the customer's orders; null when the customer has not ordered.